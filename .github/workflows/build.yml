name: Build & Release

# 触发条件：
#   1. 推送 v* 形式的 tag（如 v1.0.0）-> 构建 exe 并发布 GitHub Release 供下载
#   2. 手动触发（Actions 页面 Run workflow）-> 仅构建并上传为 workflow 产物
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # 创建 Release 需要

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        shell: cmd
        run: >-
          pyinstaller --noconfirm --onefile --windowed
          --name "VCSTool"
          --icon "icon.ico"
          --add-data "icon.ico;."
          --collect-all keyboard
          main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VCSTool-windows-exe
          path: dist/VCSTool.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VCSTool.exe
          name: VCSTool ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
